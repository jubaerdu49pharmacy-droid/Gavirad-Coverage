<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gavirad — Connection Check</title>
<style>
  body{margin:0;background:#F5F7FB;color:#1E2761;
       font-family:-apple-system,"Segoe UI",Roboto,Calibri,system-ui,sans-serif;font-size:15px}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#5A6478;font-size:13px;margin-bottom:16px}
  .box{background:#fff;border:1px solid #E4E9F2;border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:11px;letter-spacing:1.1px;color:#E39A2B;text-transform:uppercase;margin:0 0 10px}
  .st{padding:10px 13px;border-radius:9px;font-size:13.5px;margin-bottom:14px}
  .st.load{background:#FFF8EC;color:#8A6510}
  .st.ok{background:#EEF7F2;color:#186B45}
  .st.err{background:#FDF0EF;color:#A32B22}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:10px;color:#5A6478;text-transform:uppercase;letter-spacing:.5px;
     padding:0 6px 7px;border-bottom:1px solid #E4E9F2}
  td{padding:7px 6px;border-bottom:1px solid #F4F6FA;vertical-align:top}
  .good{color:#1E8E5A;font-weight:700}
  .bad{color:#D0342C;font-weight:700}
  select{border:1px solid #E4E9F2;border-radius:9px;padding:9px 11px;font-size:14px;
         font-family:inherit;color:#1E2761;background:#fff;margin-bottom:12px}
  code{background:#F1F4FA;padding:1px 5px;border-radius:4px;font-size:12px}
  .fix{font-size:13px;line-height:1.6;color:#3C4557}
</style>
<div class="wrap">
  <h1>Connection check</h1>
  <div class="sub">Shows exactly what is in the Google Sheet and whether each row can be matched
    to a chemist in the zone data.</div>

  <div id="status" class="st load">Reading the Sheet…</div>

  <div class="box">
    <h2>Zone to test against</h2>
    <select id="zsel"><option value="">Loading zones…</option></select>
    <div id="zinfo" class="fix"></div>
  </div>

  <div class="box"><h2>Rows in the Sheet</h2><div id="rows"></div></div>
  <div class="box"><h2>What to fix</h2><div id="fix" class="fix"></div></div>
</div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbxzXp-SiNm9gTuIPjeoKoBbYMlS71Wt5iTtCN5ehQYgqpWerdYul1CXu9LB1mYVy20_/exec";
const el=id=>document.getElementById(id);
let ROWS=null, IX=null, ZD=null;

function setStatus(c,m){ el('status').className='st '+c; el('status').textContent=m; }

fetch('data/zones.json').then(r=>r.json()).then(ix=>{
  IX=ix;
  el('zsel').innerHTML=ix.map(z=>'<option>'+z.zone+'</option>').join('');
  el('zsel').onchange=loadZone;
  loadZone();
});
function loadZone(){
  const z=IX.find(x=>x.zone===el('zsel').value);
  fetch(z.file).then(r=>r.json()).then(d=>{ ZD=d; show(); });
}

const cbName='chk'+Date.now();
window[cbName]=function(res){
  if(!res||!res.rows){ setStatus('err','The script replied but sent no rows.'); return; }
  ROWS=res.rows;
  setStatus('ok',ROWS.length+' row'+(ROWS.length===1?'':'s')+' found in the Sheet.');
  show();
};
(function(){
  const s=document.createElement('script');
  s.src=ENDPOINT+'?action=read&callback='+cbName+'&t='+Date.now();
  s.onerror=()=>setStatus('err','Could not reach the script. The action=read code is probably '
    +'not deployed yet — paste it in Apps Script, then Deploy → Manage deployments → New version.');
  document.body.appendChild(s);
})();

function show(){
  if(!ROWS||!ZD) return;
  const terrs={}; let chem=0;
  ZD.regions.forEach(r=>r.territories.forEach(t=>{
    terrs[t.name]=new Set((t.chem||[]).map(c=>c[0])); chem+=(t.chem||[]).length; }));
  el('zinfo').innerHTML='<b>'+ZD.zone+'</b> — '+Object.keys(terrs).length+' territories, '
    +chem.toLocaleString()+' chemists. A row is applied only when its Zone matches <code>'
    +ZD.zone+'</code>, its Territory matches one of these, and its Chemist Code exists there.';

  let okCount=0; const why={};
  const body=ROWS.slice(-40).reverse().map(r=>{
    const zone=String(r[2]||'').trim(), terr=String(r[4]||'').trim();
    const code=String(r[5]||'').replace(/^'/,'').trim(), status=String(r[7]||'').trim();
    let verdict='', cls='bad';
    if(zone!==ZD.zone) verdict='Zone does not match "'+ZD.zone+'"';
    else if(!terrs[terr]) verdict='Territory not found in this zone';
    else if(!terrs[terr].has(code)) verdict='Chemist code not in that territory';
    else if(status!=='ordered'&&status!=='cleared') verdict='Status is not "ordered"';
    else { verdict='Applied'; cls='good'; okCount++; }
    if(cls==='bad') why[verdict]=(why[verdict]||0)+1;
    return '<tr><td>'+(r[0]||'')+'</td><td>'+(r[1]||'')+'</td><td>'+zone+'</td><td>'+terr
      +'</td><td>'+code+'</td><td>'+status+'</td><td class="'+cls+'">'+verdict+'</td></tr>';
  }).join('');
  el('rows').innerHTML='<table><thead><tr><th>Timestamp</th><th>Rep</th><th>Zone</th>'
    +'<th>Territory</th><th>Code</th><th>Status</th><th>Result</th></tr></thead><tbody>'
    +body+'</tbody></table>';

  const keys=Object.keys(why);
  el('fix').innerHTML = okCount
    ? '<b class="good">'+okCount+' row'+(okCount===1?'':'s')+' will show in the shared view for '
      +ZD.zone+'.</b> If a device still shows nothing, tap Refresh on the sync bar, or check that '
      +'it opened the same zone.'
    : (keys.length
        ? 'No rows matched this zone. Reasons found:<br>• '+keys.map(k=>k+' ('+why[k]+')').join('<br>• ')
          +'<br><br>Rows written by hand with made-up values (territory “Test”, code 000000) can '
          +'never match — mark a real chemist from the MIO portal instead. If a genuine entry is '
          +'listed above with a mismatch, tell me the Zone and Territory it shows and I will align it.'
        : 'The Sheet has no rows yet. Mark an order from the MIO portal, wait for the sync bar to '
          +'read “All orders sent”, then reload this page.');
}
</script>
